<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAT Prep</title>
<meta name="description" content="Topic-wise CAT past-paper practice with timing, progress tracking and an AI tutor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial' font-size='18' font-weight='700' text-anchor='middle' fill='white'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">CAT Prep</a>
  <a class="navlink" href="#/settings" data-nav="settings">Settings</a>
</header>
<main id="app"><p class="muted center">Loading…</p></main>

<button id="ai-toggle" type="button" hidden aria-label="Open AI tutor">AI</button>
<aside id="ai-panel" aria-label="AI tutor" hidden>
  <div class="ai-resize" title="Drag to resize"></div>
  <div class="ai-head">
    <div><div class="ai-title">Tutor</div><div class="ai-sub" id="ai-sub"></div></div>
    <button class="icon" id="ai-close" type="button" aria-label="Close">×</button>
  </div>
  <div class="ai-quick" id="ai-quick"></div>
  <div class="chat" id="chat"></div>
  <form class="ai-form" id="ai-form">
    <textarea id="ai-input" rows="2" placeholder="Ask about this question…"></textarea>
    <button class="btn primary" type="submit">Send</button>
  </form>
</aside>
<script src="app.js"></script>
</body>
</html>
