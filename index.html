<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAT Prep</title>
<meta name="description" content="Topic-wise CAT past-paper practice with timing, progress tracking and an AI tutor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial' font-size='18' font-weight='600' text-anchor='middle' fill='white'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="bg" aria-hidden="true"><div id="bg-player"></div></div>
<div id="music" hidden>
  <button id="music-btn" type="button" aria-label="Play study music"></button>
  <input id="music-vol" type="range" min="0" max="100" step="1" aria-label="Music volume">
</div>
<header class="top">
  <nav id="nav">
    <a href="#/" data-nav="home" data-ic="overview">Overview</a>
    <a href="#/sec/QA" data-nav="QA" data-ic="QA">Quant</a>
    <a href="#/sec/DILR" data-nav="DILR" data-ic="DILR">DILR</a>
    <a href="#/sec/VARC" data-nav="VARC" data-ic="VARC">VARC</a>
    <a href="#/settings" data-nav="settings" data-ic="settings">Settings</a>
  </nav>
</header>
<main id="app"><p class="muted center">Loading…</p></main>

<div id="dock" hidden>
  <div class="dock-time">
    <button class="icon" id="pause" type="button" aria-label="Pause">❚❚</button>
    <span id="clock">0:00</span><span id="clock2" class="muted"></span>
  </div>
  <div class="dock-mid">
    <button class="btn quiet" id="reveal" type="button">Show answer</button>
    <button class="btn primary" id="submit" type="button" disabled>Submit</button>
  </div>
  <div class="dock-nav">
    <a class="icon" id="prev" aria-label="Previous">←</a>
    <a class="icon" id="next" aria-label="Next">→</a>
  </div>
</div>

<button id="ai-toggle" type="button" hidden aria-label="Ask the tutor">
  <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
  <span>Ask</span>
</button>
<aside id="ai-panel" aria-label="Tutor" hidden>
  <div class="ai-resize" title="Drag to resize"></div>
  <header class="ai-head">
    <div class="ai-title"><span>Tutor</span><span class="ai-sub" id="ai-sub"></span></div>
    <button class="icon" id="ai-new" type="button" title="Start over" aria-label="Start a new chat"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5v4h4"/></svg></button>
    <button class="icon" id="ai-close" type="button" title="Close (Esc)" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="ai-scroll" id="ai-scroll"><div class="ai-thread" id="chat"></div></div>
  <div class="ai-bottom">
    <div class="ai-quick" id="ai-quick"></div>
    <form class="composer" id="ai-form">
      <textarea id="ai-input" rows="1" placeholder="Ask about this question…" enterkeyhint="send"></textarea>
      <div class="composer-row">
        <span class="composer-model" id="ai-model"></span>
        <button class="send" id="ai-send" type="submit" aria-label="Send" disabled><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </div>
    </form>
  </div>
</aside>
<script src="app.js"></script>
</body>
</html>
